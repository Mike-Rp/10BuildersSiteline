<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff sign-in · Design proposal</title><link rel="icon" href="/images/10-builders-logo.png"><link rel="stylesheet" href="/dist/assets/index-BHD4ptGG.css"><style>/* Login-only presentation; password reset and workspace screens retain their styles. */
#root .login-redesign {
  font-family: "Inter", Arial, sans-serif;
  min-height: 100svh;
  padding: clamp(16px, 3vw, 48px);
  background: #edf1f5;
}
#root .login-redesign .login-card {
  max-width: 1240px;
  min-height: 660px;
  padding: 10px;
  border: 1px solid #e0e6ed;
  border-radius: 24px;
  box-shadow: 0 20px 70px #172b4d0d;
}
#root .login-redesign .login-panel {
  flex: 1 1 48%;
  min-width: 0;
  padding: 30px clamp(28px, 4vw, 64px) 22px;
}
#root .login-redesign .login-panel > :is(.login-brand, .login-content, .login-foot) {
  width: 100%;
  max-width: 390px;
  margin-inline: auto;
}
#root .login-redesign .login-brand { color: #172b4d; }
#root .login-redesign .brand-mark {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  color: #172b4d;
  background: #eef3f8;
  border: 1px solid #dce5ef;
  border-radius: 11px;
}
#root .login-redesign .login-brand strong { font-size: 22px; }
#root .login-redesign .login-content {
  width: 100%;
  max-width: 390px;
  margin: 32px auto 0;
  padding-block: 0 24px;
}
#root .login-redesign .login-heading { margin: 0 0 28px; }
#root .login-redesign .login-heading h1 {
  color: #172b4d;
  font-size: clamp(26px, 2.4vw, 32px);
  letter-spacing: -1px;
}
#root .login-redesign .login-heading p { margin-top: 12px; line-height: 1.7; }
#root .login-redesign .login-form { gap: 20px; }
#root .login-redesign .login-form input {
  min-height: 50px;
  border: 1px solid #c7d2df;
  border-radius: 8px;
  background: #fff;
  font-size: 16px;
}
#root .login-redesign .password-field input { padding-right: 70px; }
#root .login-redesign .login-form input[aria-invalid="true"] { border-color: var(--color-danger); }
#root .login-redesign .login-form input:focus { border-color: var(--color-steel, #315a85); }
#root .login-redesign .password-toggle { min-width: 54px; min-height: 44px; }
#root .login-redesign .login-help { font-size: 14px; line-height: 1.7; }
#root .login-redesign .login-submit {
  min-height: 50px;
  border-radius: 8px;
  background: #172b4d;
  color: #fff;
  font-weight: 600;
}
#root .login-redesign .login-submit:hover:not(:disabled) { background: #27486b; }
#root .login-redesign .login-foot {
  margin-top: 0;
  padding-top: 18px;
  border-top: 1px solid #e8edf3;
}
#root .login-redesign .login-foot p { font-size: 14px; }
#root .login-redesign .login-info {
  position: relative;
  flex: 1 1 52%;
  min-width: 0;
  min-height: 600px;
  overflow: hidden;
  justify-content: space-between;
  padding: 30px;
  border-radius: 16px;
  isolation: isolate;
  background: #172b4d;
}
#root .login-redesign .login-photo { position: absolute; inset: 0; z-index: -2; }
#root .login-redesign .login-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; }
#root .login-redesign .login-info::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(180deg, #0d213844 0%, #0d213800 34%, #0d2138dd 100%);
}
#root .login-redesign .login-photo-caption { margin-top: auto; padding-top: 260px; }
#root .login-redesign .login-info h2 { margin: 10px 0 0; color: #fff; font-size: clamp(24px, 2.3vw, 32px); line-height: 1.25; letter-spacing: -.6px; font-weight: 600; }
#root .login-redesign .login-banner-image { opacity: 0; transition: opacity 600ms ease; }
#root .login-redesign .login-banner-image.is-active { opacity: 1; }
#root .login-redesign .login-banner-brand { color: #d4e4f4; font-size: 14px; font-weight: 600; letter-spacing: .5px; }
#root .login-redesign .login-banner-description { color: #e4edf7; font-size: 16px; line-height: 1.6; margin-top: 14px; min-height: 52px; }
#root .login-redesign .login-banner [aria-roledescription="slide"] { min-height: 128px; }
#root .login-redesign .login-banner-footer { margin-top: 24px; padding-top: 14px; border-top: 1px solid #ffffff55; }
#root .login-redesign .login-banner-indicators { display: flex; align-items: center; gap: 20px; padding: 20px 8px; }
#root .login-redesign .login-banner-indicator { width: 24px; height: 4px; border-radius: 3px; background: #ffffff66; }
#root .login-redesign .login-banner-indicator.is-active { background: #fff; }
@media (prefers-reduced-motion: reduce) {
  #root .login-redesign .login-banner-image { transition: none; }
}
@media (max-width: 1000px) {
  #root .login-redesign .login-panel { padding-inline: 24px; }
  #root .login-redesign .login-info { padding: 24px; }
  #root .login-redesign .login-banner [aria-roledescription="slide"] { min-height: 200px; }
}
@media (max-width: 760px) {
  #root .login-redesign { padding: 16px; }
  #root .login-redesign .login-card { flex-direction: column; max-width: 500px; min-height: 0; padding: 0; border-radius: 18px; }
  #root .login-redesign .login-panel { flex: none; padding: 28px 24px; }
  #root .login-redesign .login-info { display: none; }
}

#root .login-redesign .login-help a { text-decoration: underline; text-underline-offset: 3px; }
#root .login-redesign .login-portal-switch { width: 100%; min-height: 44px; margin-top: 16px; border: 1px solid #c7d2df; border-radius: 8px; color: #172b4d; font-weight: 600; text-align: center; text-decoration: none; white-space: normal; }
#root .login-redesign .login-portal-switch:hover { background: #eef3f8; border-color: #526b87; }

#root .login-redesign .company-logo-mark { flex: none; width: 50px; height: 76px; background: transparent; border: 0; border-radius: 0; }
#root .login-redesign .company-logo-mark img { display: block; width: 50px; height: 76px; object-fit: contain; }
#root .login-redesign .login-brand { gap: 15px; }
#root .login-redesign .login-brand > span:last-child { min-width: 0; }
#root .login-redesign .login-brand small { max-width: 300px; font-size: 13px; line-height: 1.5; letter-spacing: 0; }
#root .admin-login { position: relative; isolation: isolate; min-height: 100dvh; padding: clamp(12px, 2dvh, 24px) 24px; background: #10283e; }
#root .admin-login .admin-login-background { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
#root .admin-login .admin-login-background .login-photo { position: absolute; inset: -20px; z-index: 0; transform: scale(1.05); }
#root .admin-login .admin-login-background img { display: block; width: 100%; height: 100%; object-fit: cover; filter: blur(6px); }
#root .admin-login .admin-login-background::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg,#0a1f33ba,#142b4073 50%,#091c31c9); }
#root .admin-login .login-card { position: relative; z-index: 1; display: block; width: 460px; max-width: 100%; min-height: 0; padding: 0; border: 1px solid #ffffff90; border-top: 4px solid #c9a564; border-radius: 18px; box-shadow: 0 24px 80px #0005; }
#root .admin-login .login-panel { width: 100%; padding: clamp(16px, 3dvh, 34px) 38px clamp(16px, 3dvh, 30px); }
#root .admin-login .company-logo-mark { width: clamp(32px, 5.3dvh, 50px); height: clamp(48px, 8dvh, 76px); }
#root .admin-login .company-logo-mark img { width: 100%; height: 100%; }
#root .admin-login .login-content { margin-top: clamp(12px, 2dvh, 28px); padding: 0; }
#root .admin-login .login-heading { margin: clamp(8px, 1.5dvh, 17px) 0 clamp(12px, 2.3dvh, 26px); }
#root .admin-login .login-heading h1 { font-size: 28px; line-height: 1.25; letter-spacing: -.8px; }
#root .admin-login .login-heading p { font-size: 14px; line-height: 1.5; margin-top: 8px; }
#root .admin-login .login-form { gap: clamp(10px, 1.6dvh, 18px); }
#root .admin-login .login-form input, #root .admin-login .login-submit { min-height: clamp(44px, 6.5dvh, 50px); }
#root .admin-login .login-form input { line-height: 1.4; }
#root .admin-login .login-portal-switch { margin-top: clamp(10px, 1.6dvh, 16px); }
#root .admin-login .admin-access-badge { display: inline-flex; align-items: center; gap: 7px; padding: 7px 9px; border: 1px solid #e6d5b5; border-radius: 5px; background: #fcf8f0; color: #795621; font-size: 11px; font-weight: 650; letter-spacing: .7px; text-transform: uppercase; }
#root .admin-login .admin-restricted-note { display: flex; align-items: flex-start; gap: 8px; margin: clamp(12px, 2dvh, 22px) 0 0; padding-top: clamp(10px, 1.5dvh, 18px); border-top: 1px solid #e3e9f0; color: #6a7b90; font-size: 12px; line-height: 1.7; }
#root .admin-login .admin-restricted-note svg { flex: none; margin-top: 2px; }
@media(max-width:600px) {
  #root .admin-login { padding-inline: 16px; }
  #root .admin-login .login-panel { padding-inline: 24px; }
  #root .admin-login .login-heading h1 { font-size: 26px; }
  #root .admin-login .admin-login-background img { filter: blur(5px); }
}
@media(max-height:700px) {
  #root .admin-login .login-panel { padding-block: 16px; }
  #root .admin-login .login-heading { margin: 8px 0 12px; }
  #root .admin-login .login-heading h1 { font-size: 24px; }
  #root .admin-login .login-form .field { gap: 6px; }
}
@media(max-width:600px) and (max-height:700px) {
  #root .admin-login .login-panel { padding-block: 12px; }
  #root .admin-login .login-brand strong { font-size: 20px; line-height: 1.2; }
  #root .admin-login .login-brand small { font-size: 12px; line-height: 1.4; }
  #root .admin-login .login-heading h1 { font-size: 22px; }
  #root .admin-login .admin-restricted-note { line-height: 1.5; }
}

</style></head><body><div id="root"><main class="login-page login-redesign admin-login proposal-login staff-proposal"><nav class="proposal-nav" aria-label="Sign-in portals"><span class="proposal-label">10 BUILDERS · STAFF PORTAL</span><a href="/__client-login-proposal.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m3 11 9-8 9 8M6 9v12h12V9M10 21v-7h4v7"></path></svg>Client sign-in <span aria-hidden="true">↗</span></a></nav><div class="admin-login-background" aria-hidden="true"><picture class="login-photo login-banner-image" aria-hidden="true"><img src="/images/login-construction-1120.webp" srcset="/images/login-construction-720.webp 720w, /images/login-construction-1120.webp 1120w" sizes="100vw" width="1120" height="1400" alt="" decoding="async"></picture><picture class="login-photo login-banner-image is-active" aria-hidden="true"><img src="/images/login-teams-1120.webp" srcset="/images/login-teams-720.webp 720w, /images/login-teams-1120.webp 1120w" sizes="100vw" width="1120" height="1400" alt="" decoding="async"></picture><picture class="login-photo login-banner-image" aria-hidden="true"><img src="/images/login-documents-1120.webp" srcset="/images/login-documents-720.webp 720w, /images/login-documents-1120.webp 1120w" sizes="100vw" width="1120" height="1400" alt="" decoding="async"></picture></div><div class="login-card"><section class="login-panel" aria-label="Log in"><div class="login-brand"><span class="brand-mark company-logo-mark"><img src="/images/10-builders-logo.png" alt="10 Builders company logo" width="50" height="76"></span><span><strong>SITELINE</strong><small>10 Builders and Development Corporation</small></span></div><div class="login-content"><div class="admin-access-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 8 4v6c0 6-8 10-8 10S4 18 4 12V6l8-4Z"></path><path d="m8 12 3 3 5-6"></path></svg>Staff access</div><div class="login-heading"><h1>Staff sign-in</h1><p>For administrators, Office Project Managers, and Site Project Managers.</p></div><form class="login-form" novalidate=""><div class="field "><label for="_R_2ec_">Work email</label><input type="text" inputmode="email" autocapitalize="none" spellcheck="false" autocomplete="off" placeholder="name@10builders.com" aria-invalid="false" required="" id="_R_2ec_" value="" aria-label="Work email"></div><div class="field "><label for="_R_3ec_">Password</label><div class="password-field" id="_R_3ec_"><input type="password" aria-label="Password" autocomplete="off" placeholder="Enter your password" aria-invalid="false" required="" value=""><button type="button" class="button text-button password-toggle " aria-label="Show password" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div></div><button type="submit" class="button primary full-width login-submit ">Sign in to workspace</button></form><p class="preview-status" role="status"></p><p class="admin-restricted-note"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg><span>Access is based on your assigned account role.</span></p></div></section></div></main></div><script>
const photos=[...document.querySelectorAll('.login-banner-image')];const dots=[...document.querySelectorAll('.login-banner-indicator')];let active=photos.findIndex(p=>p.classList.contains('is-active'));const captions=[['Your project, in view','Follow overall progress, project milestones, and approved updates.'],['Stay connected','Keep up with your project team and the latest site updates.'],['Project documents, together','Find the approved plans, reports, and files shared with you.']];function selectSlide(index){active=index;photos.forEach((p,i)=>p.classList.toggle('is-active',i===index));dots.forEach((p,i)=>p.classList.toggle('is-active',i===index));const group=document.querySelector('[aria-roledescription=slide]');if(group){group.setAttribute('aria-label',(index+1)+' of 3');group.querySelector('h2').textContent=captions[index][0];group.querySelector('p').textContent=captions[index][1]}}dots.forEach((dot,i)=>{dot.addEventListener('click',()=>selectSlide(i))});if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{if(!document.hidden)selectSlide((active+1)%3)},6000);document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();document.querySelector('.preview-status').textContent='Design preview only — sign-in is not connected.'});document.querySelector('.password-toggle').addEventListener('click',()=>{const p=document.querySelector('.password-field input');p.type=p.type==='password'?'text':'password'});
</script></body></html>
