-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 8 4v6c0 6-8 10-8 10S4 18 4 12V6l8-4Z"></path><path d="m8 12 3 3 5-6"></path></svg>Staff access</div><div class="login-heading"><h1>Staff sign-in</h1><p>For Office PMs and Site PMs.</p></div><nav class="login-role-selector" aria-label="Staff and administrator sign-in"><a href="/__login-role-cards-staff-preview.html" aria-label="Staff sign-in" aria-current="page"><span class="role-card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V7l9-4v18M12 10h8v11M1 21h22M6 9h2m-2 4h2m-2 4h2m7-3h2m-2 4h2"></path></svg></span><span class="role-card-copy"><strong>Staff</strong><small>Office &amp; Site PMs</small></span><span class="role-card-selected" aria-hidden="true"></span></a><a href="/__login-role-cards-admin-preview.html" aria-label="Administrator sign-in"><span class="role-card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4v5c0 5-8 9-8 9s-8-4-8-9V7zM8.5 12l2.5 2.5 4.5-5"></path></svg></span><span class="role-card-copy"><strong>Admin</strong><small>Administration</small></span></a></nav><form class="login-form" novalidate=""><div class="field "><label for="_R_2id_">Work email</label><input type="text" inputmode="email" autocapitalize="none" spellcheck="false" autocomplete="username" placeholder="name@10builders.com" aria-invalid="false" required="" id="_R_2id_" value=""></div><div class="field "><label for="_R_3id_">Password</label><div class="password-field" id="_R_3id_"><input type="password" aria-label="Password" autocomplete="current-password" placeholder="Enter your password" aria-invalid="false" required="" value=""><button type="button" class="button text-button password-toggle " aria-label="Show password" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div></div><p class="login-help"><a href="#password-reset">Forgot password?</a></p><button type="submit" class="button primary full-width login-submit ">Sign in to workspace</button></form><p class="admin-restricted-note"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg><span>Access is based on your assigned account role.</span></p></div></section></div></main></div><script>document.querySelector('form').addEventListener('submit',event=>event.preventDefault());document.querySelector('.password-toggle').addEventListener('click',()=>{const field=document.querySelector('.password-field input');field.type=field.type==='password'?'text':'password'});const photos=[...document.querySelectorAll('.login-banner-image')];let active=1;if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>{if(!document.hidden){active=(active+1)%3;photos.forEach((photo,i)=>photo.classList.toggle('is-active',i===active))}},6000)</script></body></html>
