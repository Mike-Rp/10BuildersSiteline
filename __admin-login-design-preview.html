<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SITELINE Admin | 10 Builders</title><link rel="icon" type="image/png" href="/tmp/10-builders-mark-preview.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:#172b4d;background:#10283e}.admin-scene{position:fixed;inset:0;overflow:hidden;z-index:-1}.admin-slide{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;object-position:center;filter:blur(6px);transform:scale(1.05);opacity:0;transition:opacity 1000ms ease}.admin-slide.active{opacity:1}.admin-scene:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#0a1f33ba,#142b4073 50%,#091c31c9)}.sample-note{position:absolute;top:22px;left:28px;right:28px;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#e3edf5;letter-spacing:.3px}.sample-note strong{font-weight:600}.admin-page{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:76px 24px 96px}.admin-card{width:460px;max-width:100%;padding:34px 38px 30px;background:#fff;border:1px solid #ffffff90;border-top:4px solid #c9a564;border-radius:18px;box-shadow:0 24px 80px #0005}.company-brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}.company-brand img{width:46px;height:70px;object-fit:contain;flex:none}.company-brand strong{display:block;font-size:24px;line-height:1.25;letter-spacing:-.5px}.company-brand small{display:block;color:#5c7089;font-size:12px;line-height:1.6;margin-top:5px;max-width:270px}.admin-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid #e6d5b5;border-radius:5px;background:#fcf8f0;color:#795621;font-size:11px;font-weight:650;letter-spacing:.7px}.admin-badge svg{width:16px;height:16px;flex:none}h1{margin:17px 0 10px;font-size:28px;letter-spacing:-.8px;line-height:1.25}.admin-intro{font-size:14px;line-height:1.7;color:#5c7089;margin:0 0 26px}.admin-form{display:grid;gap:18px}.field{display:grid;gap:8px}.field label{font-size:14px;font-weight:600}.field input{font:inherit;width:100%;min-width:0;height:49px;border:1px solid #bbc9d9;border-radius:7px;padding:12px 13px;font-size:15px;color:#172b4d;background:#fff}.field input::placeholder{color:#7b8797}.field input:focus{outline:2px solid #315a8544;border-color:#315a85}.password-wrap{position:relative}.password-wrap input{padding-right:50px}.password-toggle{position:absolute;top:3px;right:3px;border:0;border-radius:5px;background:white;color:#315a85;width:43px;height:43px;display:grid;place-items:center;cursor:pointer}.password-toggle svg{width:19px;height:19px}.help-link{font:inherit;font-size:13px;border:0;padding:0;background:none;text-align:left;justify-self:start;text-decoration:underline;text-underline-offset:3px;color:#315a85;cursor:pointer}.sign-in{width:100%;min-height:48px;border:1px solid #172b4d;background:#172b4d;color:white;font:inherit;font-size:14px;font-weight:600;border-radius:7px;cursor:pointer}.sign-in:hover{background:#27486b}.restricted-note{margin:22px 0 0;padding-top:18px;border-top:1px solid #e3e9f0;color:#6a7b90;font-size:12px;line-height:1.7;display:flex;gap:8px;align-items:flex-start}.restricted-note svg{width:15px;height:15px;margin-top:2px;flex:none}.carousel-controls{position:fixed;left:28px;bottom:24px;display:flex;align-items:center;gap:14px;color:#e5edf4;font-size:12px}.carousel-dots{display:flex;gap:9px}.carousel-dots button{display:grid;place-items:center;border:0;padding:0;width:32px;height:32px;background:none;cursor:pointer}.carousel-dots button:after{content:"";height:4px;width:22px;background:#ffffff60;border-radius:3px}.carousel-dots button[aria-current=true]:after{background:white}.pause-control{font:inherit;font-size:12px;color:#edf4fa;border:1px solid #ffffff60;background:#10283e55;border-radius:5px;min-height:34px;padding:6px 10px;cursor:pointer}.carousel-label{position:fixed;right:28px;bottom:34px;font-size:12px;color:#d8e4ef;letter-spacing:.2px}.preview-feedback{margin:0;color:#315a85;font-size:13px;line-height:1.6}.preview-feedback:empty{display:none}button:focus-visible,a:focus-visible{outline:2px solid #d4ae6a;outline-offset:3px}@media(max-width:600px){.sample-note{left:20px;right:20px;top:18px;flex-direction:column;gap:5px;font-size:11px}.admin-page{padding:86px 16px 100px}.admin-card{padding:26px 24px 24px;border-radius:14px}.company-brand{margin-bottom:24px;gap:12px}.company-brand strong{font-size:22px}.company-brand small{font-size:11px}h1{font-size:26px}.carousel-controls{position:relative;left:auto;bottom:auto;justify-content:center;margin:-66px 0 20px;padding-inline:16px;gap:10px}.carousel-label{display:none}.admin-slide{filter:blur(5px)}}@media(prefers-reduced-motion:reduce){.admin-slide{transition:none}}
</style></head><body>
<div class="admin-scene" aria-hidden="true"><img class="admin-slide active" src="/images/login-teams-1120.webp" alt=""><img class="admin-slide" src="/images/login-construction-1120.webp" alt=""><img class="admin-slide" src="/images/login-documents-1120.webp" alt=""></div>
<header class="sample-note"><strong>ADMIN LOGIN DESIGN SAMPLE</strong><span>Preview only · No live sign-in</span></header>
<main class="admin-page"><section class="admin-card" aria-labelledby="admin-title">
<div class="company-brand"><img src="/tmp/10-builders-mark-preview.png" alt="10 Builders company logo"><div><strong>SITELINE</strong><small>10 Builders and Development Corporation</small></div></div>
<div class="admin-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 8 4v6c0 5-8 8-8 8s-8-3-8-8V7l8-4Z"/><path d="m8 12 3 3 5-6"/></svg>ADMINISTRATOR ACCESS</div>
<h1 id="admin-title">Administrator sign-in</h1><p class="admin-intro">Use your administrator account to manage the SITELINE workspace.</p>
<form class="admin-form"><div class="field"><label for="admin-email">Administrator email</label><input id="admin-email" type="email" autocomplete="off" placeholder="admin@10builders.com"></div><div class="field"><label for="admin-password">Password</label><div class="password-wrap"><input id="admin-password" type="password" autocomplete="off" placeholder="Enter your password"><button class="password-toggle" type="button" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><button type="button" class="help-link">Need help signing in?</button><button class="sign-in" type="submit">Sign in to administration</button><p class="preview-feedback" role="status"></p></form>
<p class="restricted-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>Restricted to authorized 10 Builders administrators.</span></p>
</section></main>
<script>
document.querySelectorAll('link[rel="icon"]').forEach(link=>{if(link.getAttribute('href')!='/tmp/10-builders-mark-preview.png')link.remove()});
const slides=[...document.querySelectorAll('.admin-slide')],reduced=matchMedia('(prefers-reduced-motion: reduce)');
let active=0,paused=reduced.matches,timer;
function show(index){active=index;slides.forEach((slide,i)=>slide.classList.toggle('active',i===index))}
function schedule(){clearInterval(timer);if(!paused&&!document.hidden)timer=setInterval(()=>show((active+1)%slides.length),6000)}
document.addEventListener('visibilitychange',schedule);reduced.addEventListener('change',()=>{paused=reduced.matches;schedule()});schedule();
document.querySelector('.password-toggle').addEventListener('click',event=>{const input=document.querySelector('#admin-password');input.type=input.type==='password'?'text':'password';event.currentTarget.setAttribute('aria-label',input.type==='password'?'Show password':'Hide password')});
document.querySelector('.admin-form').addEventListener('submit',event=>{event.preventDefault();document.querySelector('.preview-feedback').textContent='Visual sample only. No sign-in request was sent.'});document.querySelector('.help-link').addEventListener('click',()=>{document.querySelector('.preview-feedback').textContent='Help and recovery options will be connected after the design is approved.'});
</script></body></html>
